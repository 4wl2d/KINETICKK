name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-and-architecture:
    name: Desktop and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POKEBALL_SNAPSHOT_DIR: ${{ github.workspace }}/pokeball
    defaults:
      run:
        shell: bash
        working-directory: kinetickk

    steps:
      - name: Check out KINETICKK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: kinetickk
          persist-credentials: false

      - name: Check out pinned Pokeball Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 4wl2d/Pokeball
          ref: de9ef7384795680c836d5e6c2c9b394286058670
          path: pokeball
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17.0.20+8"

      - name: Verify JDK
        run: java -version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6

      - name: Verify architecture and run desktop tests
        run: >-
          ./gradlew
          -PpokeballSnapshotDir="$POKEBALL_SNAPSHOT_DIR"
          verifyArchitecture
          verifyPokeballArchitecture
          verifyPokeballConformance
          desktopTest
          --no-daemon
          --stacktrace
          --rerun-tasks

  wasm-and-browser:
    name: Wasm and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out KINETICKK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17.0.20+8"

      - name: Verify JDK
        run: java -version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6

      - name: Set up Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@086160e580d6e8c142ad5ba29009dcde677c6321 # v2
        with:
          chrome-version: 150.0.7871.24

      - name: Verify Chrome
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          test -x "$CHROME_BIN"
          "$CHROME_BIN" --version

      - name: Allow Chrome user-namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Compile and test Wasm, then build the browser distribution
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: >-
          ./gradlew
          compileTestKotlinWasmJs
          wasmJsBrowserTest
          wasmJsBrowserDistribution
          --no-daemon
          --stacktrace
          --rerun-tasks
