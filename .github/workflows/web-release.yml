name: Publish web release

on:
  release:
    types: [published, released, edited]
  workflow_dispatch:
  # Reconcile changes to GitHub's latest release and retry interrupted builds.
  schedule:
    - cron: '23 * * * *'
  pull_request:
    paths:
      - '.github/workflows/web-release.yml'
      - 'tools/release/**'

permissions:
  contents: read

concurrency:
  group: web-release-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      revision: ${{ steps.release.outputs.revision }}
      needed: ${{ steps.release.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test release packaging and publication
        run: python3 -m unittest discover -s tools/release -p 'test_*.py' -v
      - name: Resolve the latest stable release
        id: release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/web_release.py resolve

  build:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out deployment tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: deployment
          persist-credentials: false
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          path: game
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17.0.20+8'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Set up Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@086160e580d6e8c142ad5ba29009dcde677c6321 # v2
        with:
          chrome-version: 152.0.7977.42
      - name: Allow Chrome user-namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test Wasm and build the production distribution
        working-directory: game
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: ./gradlew wasmJsBrowserTest :app:web:wasmJsBrowserDistribution --no-daemon --max-workers=1 --stacktrace
      - name: Package verified release assets
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
        run: >-
          python3 deployment/tools/release/web_release.py package
          --root game/app/web/build/dist/wasmJs/productionExecutable
          --output web-release
          --tag "$RELEASE_TAG"
          --revision "$RELEASE_REVISION"
      - name: Transfer build to the publication job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-release
          path: web-release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: web-release
          path: web-release
      - name: Publish assets, then mark the release ready for the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/web_release.py publish --directory web-release
      - name: Record the publication
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          {
            printf 'Published web release **%s** from %s.\n\n' "$RELEASE_TAG" "$RELEASE_REVISION"
            printf 'The game at https://tomilov.tech/game/ discovers the ready release automatically.\n'
          } >> "$GITHUB_STEP_SUMMARY"
